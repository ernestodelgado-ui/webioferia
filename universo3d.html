<style>
:root{--rosa:#FF0099;--ink:#0b0b0b;--bg:#eceef0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}

.top b{font-weight:700;letter-spacing:.42em}.top span{color:#0b0b0b8c}
.top a{pointer-events:auto;color:var(--ink);text-decoration:none;border:1px solid #0b0b0b40;border-radius:999px;padding:9px 18px;letter-spacing:.14em;font-size:.72rem;background:#ffffffcc;backdrop-filter:blur(10px)}
.top a:hover{background:#fff}
#cap{position:fixed;z-index:4;left:50%;top:78px;translate:-50% 0;text-align:center;width:min(900px,92vw);pointer-events:none}
#cap .n{color:var(--rosa);letter-spacing:.3em;font-size:.8rem;margin-bottom:6px;font-weight:500}
#cap h1{margin:0;font-weight:300;font-size:clamp(2.2rem,5.4vw,4.3rem);letter-spacing:-.06em;line-height:1}
#cap h1 b{font-weight:700;color:var(--rosa)}
#cap p{margin:12px auto 0;max-width:36em;color:#0b0b0bb3;font-size:clamp(.9rem,1.3vw,1.1rem);line-height:1.35;font-weight:400}
#cap .w{display:inline-block;opacity:0;transform:translateY(.45em);filter:blur(8px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .8s ease}
#cap.in .w{opacity:1;transform:none;filter:blur(0)}
#cap .n,#cap p{opacity:0;transition:opacity .9s ease .5s}#cap.in .n,#cap.in p{opacity:1}
.nav{position:fixed;z-index:5;right:32px;bottom:28px;display:flex;gap:12px}
.nav button{font:500 .78rem "Inter";letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:#ffffffd9;border:1px solid #0b0b0b40;border-radius:999px;height:48px;padding:0 24px;cursor:pointer;backdrop-filter:blur(10px)}
.nav button:hover{background:#fff}.nav .go{background:var(--rosa);color:#fff;border-color:var(--rosa)}
.dots{position:fixed;z-index:5;left:50%;bottom:30px;translate:-50% 0;display:flex;gap:9px}
.dots i{width:7px;height:7px;border-radius:50%;background:#0b0b0b2e;cursor:pointer;transition:.3s}.dots i.a{background:var(--rosa);transform:scale(1.6)}
.hint{position:fixed;z-index:4;left:32px;bottom:30px;font-size:.72rem;color:#0b0b0b8c;letter-spacing:.04em;line-height:1.5}
.hint b{font-weight:600;color:var(--ink)}
#mp{position:fixed;z-index:3;left:4vw;right:4vw;top:244px;bottom:84px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;opacity:0;pointer-events:none;transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1);transform:translateY(24px)}
#mp.on{opacity:1;pointer-events:auto;transform:none}
.mp__map{position:relative;border-radius:28px;overflow:hidden;background:#dfeef3;box-shadow:0 34px 70px -34px #0b0b0b80}
.mp__map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mp__txt{overflow:auto;padding-right:6px;scrollbar-width:thin}
.mp__txt p{margin:0 0 16px;font-size:clamp(.88rem,1.15vw,1.05rem);line-height:1.38;color:#0b0b0bd9}
.mp__txt h3{margin:4px 0 8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.mp__txt ol{list-style:none;margin:0 0 18px;padding:0}
.mp__txt li{display:grid;grid-template-columns:2.6em 1fr auto;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid #0b0b0b26;opacity:0;transform:translateX(18px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
#mp.on li{opacity:1;transform:none}
.mp__txt li b{font-weight:500;font-size:1.7rem;letter-spacing:-.04em;line-height:1}
.mp__txt li span{font-size:.98rem}.mp__txt li em{font-style:normal;font-size:.9rem;font-weight:500}
.leg{display:flex;flex-wrap:wrap;gap:8px 14px}.leg i{display:inline-flex;align-items:center;gap:8px;font-style:normal;font-size:.78rem;font-weight:700;text-transform:uppercase}.leg i::before{content:"";width:26px;height:12px;border-radius:99px;background:var(--c)}
#kp{position:fixed;z-index:6;left:50%;bottom:92px;translate:-50% 20px;width:min(780px,92vw);display:none;grid-template-columns:10px 1fr 190px;background:#fff;color:#0b0b0b;border-radius:26px;overflow:hidden;box-shadow:0 30px 70px -26px #000a;opacity:0;transition:opacity .5s,translate .6s cubic-bezier(.2,.8,.2,1)}
#kp.on{display:grid;opacity:1;translate:-50% 0}
#kp>i{background:var(--c)}#kp>div{padding:18px 22px}#kp small{letter-spacing:.2em;font-weight:600;font-size:.7rem;text-transform:uppercase}#kp h2{margin:2px 0 6px;font-weight:300;letter-spacing:-.05em;font-size:2.2rem;line-height:1}#kp h2 b{font-weight:700}#kp p{margin:0 0 6px;font-size:.95rem;line-height:1.35}#kp img{width:100%;height:100%;object-fit:cover}#kp button{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:1.2rem;cursor:pointer}
#mod{position:fixed;inset:0;z-index:20;background:#0b0b0bb3;backdrop-filter:blur(8px);display:none;place-items:center}
#mod.on{display:grid}
#mod .box{position:relative;width:min(1280px,94vw);height:min(86vh,820px);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 40px 90px -30px #000}
#mod.phone .box{width:min(400px,92vw);height:min(86vh,860px);border-radius:36px;border:8px solid #111}
#mod iframe{width:100%;height:100%;border:0;display:block}
#mod button{position:absolute;right:14px;top:14px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:#000000b3;color:#fff;font-size:1.5rem;cursor:pointer}
#load{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);font-weight:300;letter-spacing:.3em;text-transform:uppercase;color:#0b0b0b99;transition:opacity .8s}
#load.off{opacity:0;pointer-events:none}
body.dark{--bg:#0a0a0d;--ink:#f4f4f4;--card:#ffffff14}body.dark .top span,body.dark .hint{color:#ffffff99}body.dark #cap p{color:#ffffffb3}body.dark .top a,body.dark .nav button{background:#ffffff14;border-color:#ffffff40;color:#fff}body.dark .nav .go{background:var(--rosa)}body.dark .dots i{background:#ffffff33}body.dark .dots i.a{background:var(--rosa)}body.dark .mp__txt p{color:#ffffffd9}body.dark .mp__txt li{border-color:#ffffff2e}body.dark #load{color:#ffffff99}body.dark .mp__map{background:#03060f}
.nav .bgb{min-width:48px;padding:0 18px}
@media(max-width:900px){#mp{grid-template-columns:1fr;top:210px;overflow:auto}.mp__map{min-height:46vh}}
@media(max-width:700px){.top{padding:16px}.top span{display:none}#cap{top:66px}.nav{right:14px;bottom:16px}.dots{display:none}.hint{display:none}}

<script>
const B=window.BIOFERIA,TH=window.THREE;
let INK='#0b0b0b',INV='#fff';const inkd=()=>INK==='#fff'?'#ffffffd9':'#0b0b0bd9';const COL={fuego:'#FA3710',aire:'#01DAC7',agua:'#005BFC',tierra:'#FED108',rosa:'#FF0099'};
const CN={rojo:COL.fuego,turquesa:COL.aire,azul:COL.agua,amarillo:COL.tierra,rosa:COL.rosa};
const WEB='index.html';
function back2d(){if(parent!==window)parent.postMessage('cerrar3d','*');else location.href='index.html'}

const loadImg=u=>new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(2,Math.round(w));c.height=Math.max(2,Math.round(h));return c};
const ctex=c=>{const t=new TH.CanvasTexture(c);t.encoding=TH.sRGBEncoding;t.anisotropy=8;return t};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eOut=q=>1-Math.pow(1-q,3),eBack=q=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(q-1,3)+c1*Math.pow(q-1,2)};
function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
function cover(x,im,X,Y,W,H){const k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,X+(W-w)/2,Y+(H-h)/2,w,h)}
function plane(w,h,tex,o={}){return new TH.Mesh(new TH.PlaneGeometry(w,h),new TH.MeshBasicMaterial(Object.assign({map:tex,transparent:true,side:TH.DoubleSide,depthWrite:false},o)))}
function imgCard(url,w,h,o={}){const {r=.05,px=720,border=null}=o,c=mkc(px,px*h/w),x=c.getContext('2d'),t=ctex(c),m=plane(w,h,t);if(r>0&&o.shadow!==false)addShadow(m,w,h);
  loadImg(url).then(im=>{if(!im)return;x.clearRect(0,0,c.width,c.height);x.save();rr(x,0,0,c.width,c.height,c.width*r);x.clip();cover(x,im,0,0,c.width,c.height);x.restore();if(border){x.strokeStyle=border;x.lineWidth=4;rr(x,2,2,c.width-4,c.height-4,c.width*r);x.stroke()}t.needsUpdate=true});return m}
function textPlane(w,h,px,draw,o={}){const fixed=o.fixed,sh=o.shadow;o=Object.assign({},o);delete o.fixed;delete o.shadow;const c=mkc(px,px*h/w),x=c.getContext('2d');draw(x,c.width,c.height);const m=plane(w,h,ctex(c),o);m.userData.c=c;m.userData.draw=draw;m.userData.fixed=!!fixed;if(sh)addShadow(m,w,h);return m}
const baseLetters=[];
function repaint(){scene.traverse(m=>{const d=m.userData&&m.userData.draw;if(d&&!m.userData.fixed&&m.userData.c){const c=m.userData.c,x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.textAlign='left';x.textBaseline='alphabetic';x.letterSpacing='0px';x.globalAlpha=1;d(x,c.width,c.height);m.material.map.needsUpdate=true}if(m.userData&&m.userData.redraw){m.userData.redraw();m.material.map.needsUpdate=true}});baseLetters.forEach(m=>m.material.color.set(INK).convertSRGBToLinear())}
function wrap(x,txt,maxW){const out=[];let line='';txt.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});if(line)out.push(line);return out}
function lines(x,txt,X,Y,maxW,lh){const L=wrap(x,txt,maxW);L.forEach((l,i)=>x.fillText(l,X,Y+i*lh));return Y+L.length*lh}
const shTex=(()=>{const c=mkc(256,256),x=c.getContext('2d');x.filter='blur(13px)';x.fillStyle='#000';rr(x,30,30,196,196,26);x.fill();return new TH.CanvasTexture(c)})();
function addShadow(m,w,h,op=.42){const sh=new TH.Mesh(new TH.PlaneGeometry(w*1.3,h*1.3),new TH.MeshBasicMaterial({map:shTex,transparent:true,opacity:op,depthWrite:false,side:TH.DoubleSide}));sh.position.set(0,-h*.05,-.05);sh.renderOrder=-1;m.add(sh);return m}
function detTex(f,col){const W=1240,H=780,c=mkc(W,H),x=c.getContext('2d'),t=ctex(c),dk=col==='#FED108',fg=dk?'#0b0b0b':'#fff';
  const draw=im=>{x.clearRect(0,0,W,H);x.save();rr(x,0,0,W,H,70);x.clip();x.fillStyle=col;x.fillRect(0,0,W,H);if(im){cover(x,im,0,0,W,H);x.globalAlpha=.66;x.fillStyle=col;x.fillRect(0,0,W,H);x.globalAlpha=1}
    const gr=x.createLinearGradient(0,H*.3,0,H);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,dk?'rgba(255,255,255,0)':'rgba(0,0,0,.45)');x.fillStyle=gr;x.fillRect(0,0,W,H);x.restore();
    x.fillStyle=fg;x.textAlign='left';x.textBaseline='alphabetic';x.font='400 138px Inter';x.letterSpacing='-7px';x.fillText(f.verbo.toUpperCase(),70,170);const vw=x.measureText(f.verbo.toUpperCase()).width;
    x.font='700 30px Inter';x.letterSpacing='5px';const ew=x.measureText(f.elemento.toUpperCase()).width+60;x.fillStyle=dk?'#0b0b0b2e':'#ffffff40';rr(x,70+vw+34,100,ew,62,31);x.fill();x.fillStyle=fg;x.fillText(f.elemento.toUpperCase(),70+vw+64,143);
    x.font='600 70px Inter';x.letterSpacing='-3px';let y=lines(x,f.sentido,70,310,W-380,78);
    x.font='700 26px Inter';x.letterSpacing='4px';x.globalAlpha=.85;x.fillText('LO VIVÍS EN',70,y+34);x.globalAlpha=1;x.font='600 46px Inter';x.letterSpacing='-1px';x.fillText(f.donde,70,y+92);
    x.font='400 38px Inter';x.letterSpacing='-1px';lines(x,f.detalle,70,y+160,W-300,48);t.needsUpdate=true};
  draw(null);loadImg(f.img).then(im=>{if(im)draw(im)});return t}
const pad2=n=>String(n).padStart(2,'0');
async function letterRow(str,font,px,track,fill,img,k){const mc=mkc(10,10).getContext('2d');mc.font=font;mc.letterSpacing=track+'px';const it=[...str].map(ch=>({ch,adv:mc.measureText(ch).width}));const total=it.reduce((s,a)=>s+a.adv,0),out=[];let x0=0;
  for(const a of it){if(a.ch!==' '){const w=Math.ceil(a.adv-track+px*.3),h=Math.round(px*1.3),c=mkc(w,h),cx=c.getContext('2d');cx.font=font;cx.letterSpacing=track+'px';cx.textBaseline='alphabetic';cx.fillStyle=fill;cx.fillText(a.ch,px*.15,px);
      if(img){cx.globalCompositeOperation='source-in';cx.drawImage(img,-(x0)+px*.15,0,total,h)}
      const m=plane(w*k,h*k,ctex(c));m.position.set((x0-px*.15+w/2-total/2)*k,0,0);out.push(m)}
    x0+=a.adv}
  return{meshes:out,width:total*k}}

const cv=document.getElementById('gl');
const renderer=new TH.WebGLRenderer({canvas:cv,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=TH.sRGBEncoding;
const BGC=0xeceef0;const scene=new TH.Scene();scene.background=new TH.Color(BGC);scene.fog=new TH.FogExp2(BGC,.0075);
const camera=new TH.PerspectiveCamera(48,1,.1,600);
const V3=TH.Vector3,R=54;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();

const dust=(()=>{const N=520,p=new Float32Array(N*3),c=new Float32Array(N*3),v=[],pal=[COL.fuego,COL.aire,COL.agua,COL.tierra,COL.rosa].map(h=>new TH.Color(h));
  for(let i=0;i<N;i++){const r=14+Math.random()*120,a=Math.random()*6.283;p[i*3]=Math.cos(a)*r;p[i*3+1]=(Math.random()-.5)*60;p[i*3+2]=Math.sin(a)*r;const k=pal[i%5];c[i*3]=k.r;c[i*3+1]=k.g;c[i*3+2]=k.b;v.push([(Math.random()-.5)*.5,(Math.random()-.5)*.25,(Math.random()-.5)*.5])}
  const g=new TH.BufferGeometry();g.setAttribute('position',new TH.BufferAttribute(p,3));g.setAttribute('color',new TH.BufferAttribute(c,3));const pt=new TH.Points(g,new TH.PointsMaterial({size:.55,vertexColors:true,transparent:true,opacity:.8,depthWrite:false}));scene.add(pt);return{pt,p,v,N}})();
function ring(r,y,op){const pts=[];for(let i=0;i<=140;i++){const a=i/140*6.283;pts.push(new V3(Math.cos(a)*r,y,Math.sin(a)*r))}scene.add(new TH.Line(new TH.BufferGeometry().setFromPoints(pts),new TH.LineBasicMaterial({color:0x0b0b0b,transparent:true,opacity:op})))}
ring(R,-5.4,.16);ring(R*.55,-5.4,.08);ring(R*1.5,-5.4,.05);

scene.add(new TH.AmbientLight(0xffffff,1));
const seed=new TH.Group();scene.add(seed);
const sv=document.createElement('video');sv.src='assets/video/semilla.mp4';sv.muted=true;sv.loop=false;sv.playsInline=true;sv.preload='auto';sv.crossOrigin='anonymous';
const svCol=new TH.Color(COL.fuego),svTex=new TH.VideoTexture(sv);
const svMat=new TH.ShaderMaterial({transparent:true,depthWrite:false,blending:TH.AdditiveBlending,uniforms:{map:{value:svTex},uCol:{value:svCol},uHeart:{value:0},uT:{value:0},uMode:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D map;uniform vec3 uCol;uniform float uHeart;uniform float uT;uniform float uMode;varying vec2 vUv;'+
  'void main(){vec3 c=texture2D(map,vUv).rgb;float L=dot(c,vec3(.3,.59,.11));'+
  'vec3 p0=vec3(.98,.216,.063),p1=vec3(.004,.855,.78),p2=vec3(0.,.357,.988),p3=vec3(.996,.82,.03),p4=vec3(1.,0.,.6);'+
  'vec2 q=vUv-.5;float x=fract(atan(q.y*1.78,q.x)/6.2832+.5+uT*.04)*5.;'+
  'vec3 hm=mix(p0,p1,smoothstep(0.,1.,x));hm=mix(hm,p2,smoothstep(1.,2.,x));hm=mix(hm,p3,smoothstep(2.,3.,x));hm=mix(hm,p4,smoothstep(3.,4.,x));hm=mix(hm,p0,smoothstep(4.,5.,x));'+
  'vec3 tint=mix(uCol,hm,uHeart);float e=pow(1.-smoothstep(.3,.98,length(q*2.)),1.6);'+
  'if(uMode>.5){float a=clamp(pow(L,1.15)*2.6,0.,1.)*e;gl_FragColor=vec4(tint*.92,a);}'+
  'else{vec3 c2=tint*(L*2.6)+vec3(pow(L,2.5))*.7;c2=max(c2-.02,0.)*1.4;gl_FragColor=vec4(c2*e,1.);}}'});
const svMesh=new TH.Mesh(new TH.PlaneGeometry(5.4,9.6),svMat);svMesh.scale.setScalar(1.35);svMesh.frustumCulled=false;svMesh.renderOrder=30;scene.add(svMesh);
const SEEDC=[COL.fuego,COL.aire,COL.agua,COL.tierra,COL.rosa],_tc=new TH.Color();let svOn=false;
function updateSeed(t,dt){if(!svOn){svOn=true;sv.play().catch(()=>{})}if(sv.paused)sv.play().catch(()=>{});if(sv.currentTime>16.8)sv.currentTime=6;
  const ph=t/5,idx=Math.floor(ph)%5,cyc=Math.floor(ph/5)%3===2&&ph%5<4?1:0,k=1-Math.exp(-dt*1.8);svCol.lerp(_tc.set(SEEDC[idx]),k);svMat.uniforms.uHeart.value+=(cyc-svMat.uniforms.uHeart.value)*k;svMat.uniforms.uT.value=t;svMesh.quaternion.copy(camera.quaternion)}

const ST=[];let CB=null;
function station(id,title,text,build,o={}){ST.push(Object.assign({id,title,text,build,d:12,h:0,upd:null,g:null,parts:[]},o))}
function reg(m,o={}){const p=Object.assign({d:0,k:'up',dist:1.4,len:.9},o);p.pos=m.position.clone();p.sc=m.scale.clone();p.rot=m.rotation.clone();p.w=m.geometry&&m.geometry.parameters&&m.geometry.parameters.width||0;p.ops=[];m.traverse(c=>{if(c.material&&c.material.opacity!==undefined)p.ops.push([c.material,c.material.opacity])});m.userData.part=p;CB.parts.push(m);return m}
const lens={m:null,amt:0,tgt:0,i:0,tex:[]};
const dias=Math.max(0,Math.ceil((new Date('2027-04-09T11:00:00-03:00')-Date.now())/864e5));
function applyParts(s,eT){for(const m of s.parts){const p=m.userData.part,q=clamp((eT-p.d)/p.len),e=eOut(q);let op=e;m.visible=q>0;
  m.position.copy(p.pos);m.scale.copy(p.sc);m.rotation.copy(p.rot);
  switch(p.k){case'up':m.position.y-=p.dist*(1-e);break;case'down':m.position.y+=p.dist*(1-e);break;case'left':m.position.x-=p.dist*(1-e);break;case'right':m.position.x+=p.dist*(1-e);break;
   case'scale':m.scale.multiplyScalar(.55+.45*e);break;case'pop':m.scale.multiplyScalar(Math.max(.001,eBack(q)));op=Math.min(1,q*2.5);break;
   case'wipe':m.scale.x=Math.max(.001,p.sc.x*e);m.position.x=p.pos.x-p.w*p.sc.x*(1-e)/2;op=Math.min(1,q*3);break;
   case'fan':m.position.x=p.pos.x*e;m.rotation.y=p.rot.y*e;m.position.y-=.3*(1-e);break;case'fade':break}
  for(const [mat,b] of p.ops)mat.opacity=b*op}}
